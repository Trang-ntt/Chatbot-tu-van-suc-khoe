name: Health tracker tests
on:
  push:
    paths:
      - "personal_health_tracker/**"
      - ".github/workflows/health-tracker-tests.yml"
  pull_request:
    paths:
      - "personal_health_tracker/**"
      - ".github/workflows/health-tracker-tests.yml"
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: personal_health_tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: personal_health_tracker/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
