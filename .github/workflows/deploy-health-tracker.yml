name: Health Tracker - Test and Deploy
on:
  push:
    branches: [main]
    paths:
      - "personal_health_tracker/**"
      - "main.py"
      - "requirements.txt"
      - "render.yaml"
      - ".github/workflows/deploy-health-tracker.yml"
  pull_request:
    branches: [main]
    paths:
      - "personal_health_tracker/**"
      - "main.py"
      - "requirements.txt"
      - "render.yaml"
      - ".github/workflows/deploy-health-tracker.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: personal_health_tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: personal_health_tracker/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app
      - run: python -m pytest -q
      - name: Check dashboard JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('app/static/index.html').read_text(encoding='utf-8')
          script = html.split('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/health-tracker-dashboard.js').write_text(script, encoding='utf-8')
          PY
          node --check /tmp/health-tracker-dashboard.js
      - name: Verify root ASGI entry point
        run: python -c "import sys; sys.path.insert(0, '..'); from main import app; print(app.title)"
  deploy:
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deployment when configured
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          DEPLOYED_APP_URL: ${{ vars.DEPLOYED_APP_URL }}
        run: |
          echo "## Website" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"
            echo "Render deployment was triggered." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No deploy hook is configured; if Render Auto-Deploy is enabled, it will deploy from the main branch automatically." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$DEPLOYED_APP_URL" ]; then
            echo "Open application: $DEPLOYED_APP_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "After creating the Render service, add repository variable DEPLOYED_APP_URL to show the clickable website link in this Actions Summary." >> "$GITHUB_STEP_SUMMARY"
          fi
