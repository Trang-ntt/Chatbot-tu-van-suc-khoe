<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Chatbot Y tế - Giao diện ChatGPT</title>

    <style>
      :root {
        --bg: #0f1724;
        --panel: #0b1220;
        --card: #0f1728;
        --accent: #06b6d4;
        --text: #e6eef6;
        --muted: #9aa8b6;
        --user: #0ea5a4;
        --bot: #1f2937;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
        background: linear-gradient(180deg, #071029 0%, #0b1220 100%);
        color: var(--text);
      }
      .app {
        display: flex;
        height: 100vh;
        width: 100vw;
        align-items: stretch;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
      }

      /* Chat container */
      .chat {
        width: 900px;
        max-width: calc(100% - 48px);
        height: calc(100% - 48px);
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.02),
          rgba(255, 255, 255, 0.01)
        );
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(2, 6, 23, 0.6);
        display: flex;
        overflow: hidden;
      }

      /* Left sidebar (optional) */
      .sidebar {
        width: 260px;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.01),
          rgba(255, 255, 255, 0.005)
        );
        padding: 18px;
        box-sizing: border-box;
        border-right: 1px solid rgba(255, 255, 255, 0.03);
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .brand {
        font-weight: 700;
        font-size: 18px;
        color: var(--accent);
      }
      .hint {
        color: var(--muted);
        font-size: 13px;
        margin-top: 6px;
      }

      /* Main panel */
      .panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      /* Header */
      .header {
        padding: 18px 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .title {
        font-size: 18px;
        font-weight: 600;
      }
      .subtitle {
        color: var(--muted);
        font-size: 13px;
        margin-left: 8px;
      }

      /* Messages area */
      .messages {
        flex: 1;
        padding: 20px;
        overflow: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
        background:
          radial-gradient(
            800px 400px at 10% 10%,
            rgba(6, 182, 212, 0.03),
            transparent 6%
          ),
          radial-gradient(
            600px 300px at 90% 90%,
            rgba(99, 102, 241, 0.02),
            transparent 6%
          );
      }

      .msg {
        max-width: 78%;
        padding: 12px 14px;
        border-radius: 12px;
        line-height: 1.45;
        font-size: 15px;
        box-shadow: 0 2px 6px rgba(2, 6, 23, 0.4);
        word-wrap: break-word;
      }

      .msg.user {
        align-self: flex-end;
        background: linear-gradient(
          180deg,
          rgba(14, 165, 164, 0.12),
          rgba(14, 165, 164, 0.08)
        );
        border: 1px solid rgba(14, 165, 164, 0.18);
        color: var(--text);
        border-bottom-right-radius: 6px;
      }

      .msg.bot {
        align-self: flex-start;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.02),
          rgba(255, 255, 255, 0.01)
        );
        border: 1px solid rgba(255, 255, 255, 0.03);
        color: var(--text);
        border-bottom-left-radius: 6px;
      }

      .meta {
        font-size: 12px;
        color: var(--muted);
        margin-top: 6px;
      }

      /* Typing indicator */
      .typing {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--muted);
        opacity: 0.9;
        animation: blink 1.2s infinite;
      }
      .dot:nth-child(2) {
        animation-delay: 0.15s;
      }
      .dot:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes blink {
        0% {
          opacity: 0.2;
        }
        50% {
          opacity: 1;
        }
        100% {
          opacity: 0.2;
        }
      }

      /* Input area */
      .composer {
        padding: 12px 16px;
        border-top: 1px solid rgba(255, 255, 255, 0.03);
        display: flex;
        gap: 12px;
        align-items: center;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.01),
          rgba(255, 255, 255, 0.005)
        );
      }
      .input {
        flex: 1;
        display: flex;
        gap: 8px;
        align-items: center;
        background: rgba(255, 255, 255, 0.02);
        padding: 10px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.02);
      }
      .input textarea {
        width: 100%;
        resize: none;
        border: 0;
        outline: none;
        background: transparent;
        color: var(--text);
        font-size: 15px;
        line-height: 1.4;
        max-height: 120px;
      }
      .send-btn {
        background: var(--accent);
        color: #042027;
        border: none;
        padding: 10px 14px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
      }
      .send-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      /* small screens */
      @media (max-width: 720px) {
        .chat {
          width: 100%;
          height: 100%;
          border-radius: 0;
        }
        .sidebar {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="chat" role="application" aria-label="Chatbot">
        <div class="sidebar" aria-hidden="true">
          <div class="brand">Chatbot Y tế</div>
          <div class="hint">
            Giao diện thử nghiệm. Kết nối Rasa qua REST API.
          </div>
          <div style="height: 12px"></div>
          <div style="font-size: 13px; color: var(--muted)">Mẹo</div>
          <div style="font-size: 13px; color: var(--muted)">
            - Nhập câu hỏi, nhấn Enter để gửi.
          </div>
          <div style="font-size: 13px; color: var(--muted)">- ...</div>
        </div>

        <div class="panel">
          <div class="header">
            <div class="title">Chatbot Y tế</div>
            <div class="subtitle">Hỏi đáp sức khỏe</div>
          </div>

          <div id="messages" class="messages" aria-live="polite"></div>

          <div class="composer">
            <div class="input" role="textbox" aria-label="Nhập tin nhắn">
              <textarea
                id="input"
                rows="1"
                placeholder="Gõ câu hỏi..."
              ></textarea>
            </div>
            <button id="send" class="send-btn">Gửi</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      /* ====== Cấu hình ======
       Nếu Rasa chạy trên máy local, giữ mặc định:
       RASA_REST_URL = "http://localhost:5005/webhooks/rest/webhook"
       Nếu deploy lên server, đổi thành URL public (https).
    */
      const RASA_REST_URL = "http://localhost:5005/webhooks/rest/webhook";

      const messagesEl = document.getElementById("messages");
      const inputEl = document.getElementById("input");
      const sendBtn = document.getElementById("send");

      /* Hàm thêm message vào giao diện */
      function addMessage(text, who = "bot", meta = "") {
        const wrapper = document.createElement("div");
        wrapper.className = "msg " + (who === "user" ? "user" : "bot");
        wrapper.innerHTML = `<div class="content">${escapeHtml(text)}</div>`;
        if (meta) {
          const m = document.createElement("div");
          m.className = "meta";
          m.textContent = meta;
          wrapper.appendChild(m);
        }
        messagesEl.appendChild(wrapper);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      /* Escape để tránh XSS */
      function escapeHtml(unsafe) {
        return unsafe
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      /* Typing indicator */
      let typingEl = null;
      function showTyping() {
        if (typingEl) return;
        typingEl = document.createElement("div");
        typingEl.className = "msg bot typing";
        typingEl.innerHTML =
          '<div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
        messagesEl.appendChild(typingEl);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }
      function hideTyping() {
        if (!typingEl) return;
        typingEl.remove();
        typingEl = null;
      }

      /* Gửi message tới Rasa qua REST */
      async function sendToRasa(message) {
        showTyping();
        try {
          const resp = await fetch(RASA_REST_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sender: "user_" + Date.now(), message }),
          });
          if (!resp.ok) {
            throw new Error("Lỗi kết nối tới Rasa: " + resp.status);
          }
          const data = await resp.json();
          hideTyping();

          if (!Array.isArray(data) || data.length === 0) {
            addMessage("Bot không trả lời.", "bot");
            return;
          }

          // Rasa trả về mảng các message; hiển thị tuần tự
          for (const item of data) {
            if (item.text) {
              addMessage(item.text, "bot");
            } else if (item.image) {
              addMessage("[Hình ảnh] " + item.image, "bot");
            } else if (item.custom) {
              addMessage(
                "[Custom payload] " + JSON.stringify(item.custom),
                "bot",
              );
            }
          }
        } catch (err) {
          hideTyping();
          addMessage("Lỗi: " + err.message, "bot");
        }
      }

      /* Xử lý gửi */
      async function handleSend() {
        const text = inputEl.value.trim();
        if (!text) return;
        addMessage(text, "user");
        inputEl.value = "";
        sendBtn.disabled = true;
        await sendToRasa(text);
        sendBtn.disabled = false;
        inputEl.focus();
      }

      /* Gửi khi nhấn Enter (Shift+Enter xuống dòng) */
      inputEl.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          handleSend();
        }
      });
      sendBtn.addEventListener("click", handleSend);

      /* Gửi payload khởi tạo /greet để bot chào */
      window.addEventListener("load", function () {
        // Hiển thị lời chào local trước khi gọi Rasa (tùy chọn)
        // addMessage("Xin chào! Tôi là Chatbot Y tế. Bạn muốn hỏi gì?", "bot");
        // Gọi payload /greet nếu bot có intent greet
        (async () => {
          showTyping();
          try {
            const resp = await fetch(RASA_REST_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                sender: "system_init",
                message: "/greet",
              }),
            });
            const data = await resp.json();
            hideTyping();
            if (Array.isArray(data)) {
              for (const item of data) {
                if (item.text) addMessage(item.text, "bot");
              }
            }
          } catch (e) {
            hideTyping();
            // không bắt buộc phải hiển thị lỗi khởi tạo
          }
        })();
      });
    </script>
  </body>
</html>
